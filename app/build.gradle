plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.responseinterceptor'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.responseinterceptor"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    // LSPosed API，必须使用 compileOnly，不能打包进APK
    compileOnly 'io.github.libxposed:api:101'
    // OkHttp 依赖（仅用于编译时，运行时由目标应用提供）
    compileOnly 'com.squareup.okhttp3:okhttp:4.12.0'
}
